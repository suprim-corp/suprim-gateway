<!-- Kiro form (tabs: SSO Login / API Key / Import File) -->
<div th:fragment="kiroForm" id="kiroForm" class="hidden space-y-3">
    <!-- Tab switcher -->
    <div class="flex border-b border-zinc-800">
        <button onclick="showKiroTab('sso')" id="kiroTabSso"
                class="px-3 py-2 text-xs font-medium border-b-2 border-neon-purple text-zinc-100 cursor-pointer transition-colors">
            SSO Login
        </button>
        <button onclick="showKiroTab('apikey')" id="kiroTabApikey"
                class="px-3 py-2 text-xs font-medium border-b-2 border-transparent text-zinc-500 hover:text-zinc-300 cursor-pointer transition-colors">
            API Key
        </button>
        <button onclick="showKiroTab('import')" id="kiroTabImport"
                class="px-3 py-2 text-xs font-medium border-b-2 border-transparent text-zinc-500 hover:text-zinc-300 cursor-pointer transition-colors">
            Import File
        </button>
    </div>

    <!-- SSO Login tab -->
    <div id="kiroSsoTab" class="space-y-3">
        <div id="kiroSsoForm">
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] uppercase tracking-widest text-zinc-500 mb-1 block">Start URL</label>
                    <input type="url" id="kiroSsoStartUrl" required
                           placeholder="https://d-xxxxx.awsapps.com/start"
                           class="w-full h-9 px-3 bg-zinc-950 border border-zinc-800 rounded text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-neon-purple">
                </div>
                <div>
                    <label class="text-[10px] uppercase tracking-widest text-zinc-500 mb-1 block">Region</label>
                    <select id="kiroSsoRegion"
                            class="w-full h-9 px-3 bg-zinc-950 border border-zinc-800 rounded text-xs text-zinc-100 focus:outline-none focus:border-neon-purple cursor-pointer">
                        <optgroup label="United States">
                            <option value="us-east-1" selected>us-east-1 (North Virginia)</option>
                            <option value="us-east-2">us-east-2 (Ohio)</option>
                            <option value="us-west-1">us-west-1 (North California)</option>
                            <option value="us-west-2">us-west-2 (Oregon)</option>
                        </optgroup>
                        <optgroup label="Canada">
                            <option value="ca-central-1">ca-central-1 (Central Canada)</option>
                            <option value="ca-west-1">ca-west-1 (Calgary)</option>
                        </optgroup>
                        <optgroup label="South America">
                            <option value="sa-east-1">sa-east-1 (Sao Paulo)</option>
                        </optgroup>
                        <optgroup label="Europe">
                            <option value="eu-central-1">eu-central-1 (Frankfurt)</option>
                            <option value="eu-central-2">eu-central-2 (Zurich)</option>
                            <option value="eu-west-1">eu-west-1 (Ireland)</option>
                            <option value="eu-west-2">eu-west-2 (London)</option>
                            <option value="eu-west-3">eu-west-3 (Paris)</option>
                            <option value="eu-north-1">eu-north-1 (Stockholm)</option>
                            <option value="eu-south-1">eu-south-1 (Milan)</option>
                            <option value="eu-south-2">eu-south-2 (Spain)</option>
                        </optgroup>
                        <optgroup label="Middle East and Africa">
                            <option value="il-central-1">il-central-1 (Tel Aviv)</option>
                            <option value="me-central-1">me-central-1 (United Arab Emirates)</option>
                            <option value="me-south-1">me-south-1 (Bahrain)</option>
                            <option value="af-south-1">af-south-1 (Cape Town)</option>
                        </optgroup>
                        <optgroup label="Asia Pacific">
                            <option value="ap-east-1">ap-east-1 (Hong Kong)</option>
                            <option value="ap-south-1">ap-south-1 (Mumbai)</option>
                            <option value="ap-south-2">ap-south-2 (Hyderabad)</option>
                            <option value="ap-northeast-1">ap-northeast-1 (Tokyo)</option>
                            <option value="ap-northeast-2">ap-northeast-2 (Seoul)</option>
                            <option value="ap-northeast-3">ap-northeast-3 (Osaka)</option>
                            <option value="ap-southeast-1">ap-southeast-1 (Singapore)</option>
                            <option value="ap-southeast-2">ap-southeast-2 (Sydney)</option>
                            <option value="ap-southeast-3">ap-southeast-3 (Jakarta)</option>
                            <option value="ap-southeast-4">ap-southeast-4 (Melbourne)</option>
                        </optgroup>
                    </select>
                </div>
            </div>
            <div class="flex gap-2 justify-end mt-3">
                <button type="button" onclick="showChoices()"
                        class="h-8 px-3 text-xs text-zinc-400 hover:text-zinc-100 cursor-pointer transition-colors">
                    Back
                </button>
                <button type="button" onclick="startKiroSso()"
                        class="h-8 px-4 bg-neon-purple text-zinc-950 font-medium rounded text-xs cursor-pointer hover:bg-purple-300 transition-colors">
                    Connect
                </button>
            </div>
        </div>

        <!-- Verification UI (shown after start) -->
        <div id="kiroSsoVerification" class="hidden space-y-4">
            <div class="text-center space-y-3">
                <p class="text-xs text-zinc-400">Open the link below and enter this code:</p>
                <div class="flex items-center justify-center gap-2">
                    <code id="kiroSsoUserCode" class="text-xl font-bold text-neon-purple tracking-widest"></code>
                    <button onclick="navigator.clipboard.writeText(document.getElementById('kiroSsoUserCode').textContent).then(function(){toast('Copied','success')})"
                            class="text-zinc-500 hover:text-zinc-100 cursor-pointer transition-colors">
                        <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                    </button>
                </div>
                <a id="kiroSsoLink" href="#" target="_blank" rel="noopener"
                   class="inline-block text-xs text-neon-purple hover:text-purple-300 underline underline-offset-2 cursor-pointer transition-colors">
                    Open verification page
                </a>
            </div>
            <div class="flex items-center justify-center gap-2 text-xs text-zinc-500">
                <svg class="size-3 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                <span>Waiting for login...</span>
            </div>
            <div id="kiroSsoError" class="hidden text-center text-xs text-red-400"></div>
            <div class="flex gap-2 justify-end">
                <button type="button" onclick="cancelKiroSso()"
                        class="h-8 px-3 text-xs text-zinc-400 hover:text-zinc-100 cursor-pointer transition-colors">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- API Key tab -->
    <form id="kiroApikeyTab" action="/providers/add-key" method="post" class="hidden space-y-3">
        <input type="hidden" name="provider" value="KIRO">
        <div>
            <label class="text-[10px] uppercase tracking-widest text-zinc-500 mb-1 block">Kiro CLI API Key</label>
            <input type="password" name="apiKey" required placeholder="kiro-..."
                   class="w-full h-9 px-3 bg-zinc-950 border border-zinc-800 rounded text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-neon-purple">
        </div>
        <div class="flex gap-2 justify-end">
            <button type="button" onclick="showChoices()"
                    class="h-8 px-3 text-xs text-zinc-400 hover:text-zinc-100 cursor-pointer transition-colors">
                Back
            </button>
            <button type="submit"
                    class="h-8 px-4 bg-neon-purple text-zinc-950 font-medium rounded text-xs cursor-pointer hover:bg-purple-300 transition-colors">
                Add
            </button>
        </div>
    </form>

    <!-- Import File tab -->
    <form id="kiroImportTab" action="/auth/import" method="post" enctype="multipart/form-data"
          class="hidden space-y-3">
        <div>
            <label class="text-[10px] uppercase tracking-widest text-zinc-500 mb-1 block">Account Name</label>
            <input type="text" name="name" placeholder="My Kiro Account"
                   class="w-full h-9 px-3 bg-zinc-950 border border-zinc-800 rounded text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-neon-purple">
        </div>
        <div>
            <label class="text-[10px] uppercase tracking-widest text-zinc-500 mb-1 block">JSON Files</label>
            <p class="text-[10px] text-zinc-500 mb-2">Select 1-2 JSON files (token file with refreshToken,
                client file with clientId)</p>
            <input type="file" name="files" accept=".json" multiple id="kiroFileInput"
                   class="block w-full text-xs text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border file:border-zinc-700 file:text-xs file:font-medium file:bg-zinc-800 file:text-zinc-300 file:cursor-pointer hover:file:bg-zinc-700 transition-colors">
            <div id="kiroFileList" class="mt-2 space-y-1 hidden"></div>
        </div>
        <div class="flex gap-2 justify-end">
            <button type="button" onclick="showChoices()"
                    class="h-8 px-3 text-xs text-zinc-400 hover:text-zinc-100 cursor-pointer transition-colors">
                Back
            </button>
            <button type="submit"
                    class="h-8 px-4 bg-neon-purple text-zinc-950 font-medium rounded text-xs cursor-pointer hover:bg-purple-300 transition-colors">
                Import
            </button>
        </div>
    </form>
</div>
