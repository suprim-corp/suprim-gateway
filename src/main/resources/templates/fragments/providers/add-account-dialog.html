<dialog th:fragment="addAccountDialog" id="addAccountDialog"
        class="bg-zinc-900 border border-zinc-800 rounded-lg p-0 w-[480px] backdrop:bg-black/50">
    <div class="p-5 space-y-4">
        <div class="flex items-center justify-between">
            <h2 class="text-sm font-semibold text-zinc-100" id="dialogTitle">Add Account</h2>
            <button onclick="document.getElementById('addAccountDialog').close()"
                    class="text-zinc-500 hover:text-zinc-100 cursor-pointer">
                <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Provider choices -->
        <div class="space-y-2" id="providerChoices">
            <button onclick="showProviderForm('kiro')"
                    class="flex items-center gap-3 p-3 border border-zinc-800 rounded-lg hover:border-neon-purple hover:bg-purple-500/5 transition-colors cursor-pointer w-full text-left">
                <img src="https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/light/kiro-color.png"
                     class="size-8" alt="Kiro">
                <div>
                    <div class="text-xs font-medium text-zinc-100">Kiro</div>
                    <div class="text-[10px] text-zinc-500">SSO login or import credentials</div>
                </div>
            </button>
            <button onclick="showProviderForm('antigravity')"
                    class="flex items-center gap-3 p-3 border border-zinc-800 rounded-lg hover:border-neon-purple hover:bg-purple-500/5 transition-colors cursor-pointer w-full text-left">
                <img src="https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/light/antigravity-color.png"
                     class="size-8" alt="Antigravity">
                <div>
                    <div class="text-xs font-medium text-zinc-100">Antigravity</div>
                    <div class="text-[10px] text-zinc-500">Connect via Google OAuth</div>
                </div>
            </button>
            <button onclick="showProviderForm('codex')"
                    class="flex items-center gap-3 p-3 border border-zinc-800 rounded-lg hover:border-neon-purple hover:bg-purple-500/5 transition-colors cursor-pointer w-full text-left">
                <img src="https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/dark/openai.png"
                     class="size-8" alt="Codex">
                <div>
                    <div class="text-xs font-medium text-zinc-100">Codex</div>
                    <div class="text-[10px] text-zinc-500">Connect via OpenAI OAuth</div>
                </div>
            </button>
            <button onclick="showProviderForm('xai')"
                    class="flex items-center gap-3 p-3 border border-zinc-800 rounded-lg hover:border-neon-purple hover:bg-purple-500/5 transition-colors cursor-pointer w-full text-left">
                <img src="https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/dark/xai.png"
                     class="size-8" alt="xAI">
                <div>
                    <div class="text-xs font-medium text-zinc-100">xAI</div>
                    <div class="text-[10px] text-zinc-500">Connect via xAI OAuth</div>
                </div>
            </button>
            <button onclick="showProviderForm('deepseek')"
                    class="flex items-center gap-3 p-3 border border-zinc-800 rounded-lg hover:border-neon-purple hover:bg-purple-500/5 transition-colors cursor-pointer w-full text-left">
                <img src="https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/dark/deepseek-color.png"
                     class="size-8" alt="DeepSeek">
                <div>
                    <div class="text-xs font-medium text-zinc-100">DeepSeek</div>
                    <div class="text-[10px] text-zinc-500">Login with email and password</div>
                </div>
            </button>
        </div>

        <th:block th:replace="~{fragments/providers/kiro-form :: kiroForm}"/>
        <th:block th:replace="~{fragments/providers/oauth-forms :: antigravityForm}"/>
        <th:block th:replace="~{fragments/providers/oauth-forms :: codexForm}"/>
        <th:block th:replace="~{fragments/providers/oauth-forms :: xaiForm}"/>
        <th:block th:replace="~{fragments/providers/oauth-forms :: deepseekForm}"/>
    </div>
</dialog>
