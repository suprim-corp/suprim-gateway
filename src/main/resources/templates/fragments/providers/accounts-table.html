<th:block th:fragment="accountsTable">
    <div th:if="${!accounts.isEmpty()}"
         class="grid gap-3 grid-cols-1 md:grid-cols-2 xl:grid-cols-3">
        <!--/* Each card lazy-loads its own usage; data-index drives both that fetch
               and the per-account form actions. */-->
        <div th:each="account, iter : ${accounts}"
             th:data-index="${iter.index}"
             class="account-card flex flex-col border border-zinc-800 bg-zinc-900/50 rounded-lg p-4">
            <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                    <span class="inline-edit-name block truncate text-xs text-zinc-100 cursor-pointer hover:text-neon-purple transition-colors"
                          th:data-index="${iter.index}"
                          th:text="${account.name() != null ? account.name() : (account.provider() != null ? account.provider() : 'Unnamed')}"></span>
                    <form th:action="@{/providers/{idx}/rename(idx=${iter.index})}" method="post"
                          class="hidden inline-edit-form">
                        <input type="text" name="name"
                               th:value="${account.name() != null ? account.name() : ''}"
                               class="h-7 px-2 bg-zinc-950 border border-neon-purple rounded text-xs text-zinc-100 focus:outline-none w-full">
                    </form>
                    <div class="flex items-center gap-1.5 mt-1">
                        <img th:if="${account.provider() == 'KIRO'}"
                             src="https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/light/kiro-color.png"
                             class="size-3.5" alt="Kiro">
                        <img th:if="${account.provider() == 'ANTIGRAVITY'}"
                             src="https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/light/antigravity-color.png"
                             class="size-3.5" alt="Antigravity">
                        <img th:if="${account.provider() == 'CODEX'}"
                             src="https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/dark/openai.png"
                             class="size-3.5" alt="Codex">
                        <img th:if="${account.provider() == 'XAI'}"
                             src="https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/dark/xai.png"
                             class="size-3.5" alt="xAI">
                        <img th:if="${account.provider() == 'DEEPSEEK'}"
                             src="https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/dark/deepseek-color.png"
                             class="size-3.5" alt="DeepSeek">
                        <span class="text-[10px] uppercase tracking-widest text-zinc-500"
                              th:text="${account.provider() != null ? account.provider() : 'UNKNOWN'}"></span>
                    </div>
                </div>
                <span th:if="${account.accessToken() == null}"
                      class="shrink-0 inline-flex items-center gap-1.5 text-[11px] text-red-400">
                    <span class="size-1.5 rounded-full bg-red-400"></span>
                    Disconnected
                </span>
                <span th:if="${account.accessToken() != null && (account.expiresAt() == null || account.expiresAt().isAfter(T(java.time.Instant).now()))}"
                      class="shrink-0 inline-flex items-center gap-1.5 text-[11px] text-neon-green">
                    <span class="size-1.5 rounded-full bg-green-400"></span>
                    Connected
                </span>
                <span th:if="${account.accessToken() != null && account.expiresAt() != null && !account.expiresAt().isAfter(T(java.time.Instant).now())}"
                      class="shrink-0 inline-flex items-center gap-1.5 text-[11px] text-red-400">
                    <span class="size-1.5 rounded-full bg-red-400"></span>
                    Expired
                </span>
            </div>

            <!--/* Filled in by loadCardUsage once the card scrolls into view. Accounts
                   with no token never report usage, so they keep the placeholder. */-->
            <div class="card-usage mt-3 min-h-[2.25rem]"
                 th:classappend="${account.accessToken() == null} ? 'invisible' : ''">
                <div class="flex items-center justify-between text-[11px]">
                    <span class="card-usage-label text-zinc-500">&nbsp;</span>
                    <span class="card-usage-value text-zinc-400"></span>
                </div>
                <div class="card-usage-track hidden mt-1.5 h-1 bg-zinc-800 rounded-full overflow-hidden">
                    <div class="card-usage-bar h-full rounded-full transition-all"></div>
                </div>
            </div>

            <div class="flex items-center justify-between gap-2 mt-4 pt-3 border-t border-zinc-800">
                <button th:data-index="${iter.index}" onclick="showModels(this.dataset.index)"
                        class="text-[11px] text-zinc-400 hover:text-neon-purple transition-colors cursor-pointer underline underline-offset-2">
                    View Models
                </button>
                <div class="flex items-center gap-3">
                    <a th:if="${account.accessToken() == null && account.provider() == 'XAI'}"
                       href="/auth/xai"
                       class="text-[11px] text-neon-purple hover:text-purple-300 transition-colors cursor-pointer">
                        Reconnect
                    </a>
                    <a th:if="${account.accessToken() == null && account.provider() == 'CODEX'}"
                       href="/auth/codex"
                       class="text-[11px] text-neon-purple hover:text-purple-300 transition-colors cursor-pointer">
                        Reconnect
                    </a>
                    <form th:action="@{/providers/{idx}/delete(idx=${iter.index})}" method="post" class="inline"
                          onsubmit="return confirm('Delete this account?')">
                        <button type="submit"
                                class="text-zinc-500 hover:text-red-400 transition-colors cursor-pointer">
                            <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${accounts.isEmpty()}"
         class="border border-zinc-800 bg-zinc-900/50 rounded-lg px-4 py-8 text-center text-zinc-500 text-xs">
        No accounts configured. Click "Add Account" to get started.
    </div>
</th:block>
