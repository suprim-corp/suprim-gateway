<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<th:block th:fragment="content">
    <div class="space-y-6">
        <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 min-w-0">
                <h1 class="text-lg font-semibold tracking-tight">Providers</h1>
                <select th:if="${!providerNames.isEmpty()}" id="providerFilterSelect"
                        aria-label="Filter accounts by provider"
                        class="h-7 pl-2.5 pr-7 bg-zinc-900 border border-zinc-800 rounded text-[10px] uppercase tracking-widest text-zinc-400 hover:text-zinc-100 focus:outline-none focus:border-neon-purple transition-colors cursor-pointer">
                    <option value="">All providers</option>
                    <option th:each="name : ${providerNames}"
                            th:value="${name}"
                            th:text="${name}"
                            th:selected="${name == providerFilter}"></option>
                </select>
            </div>
            <button onclick="document.getElementById('addAccountDialog').showModal()"
                    class="shrink-0 h-9 px-4 bg-neon-purple text-zinc-950 font-medium rounded text-xs cursor-pointer hover:bg-purple-300 transition-colors">
                Add Account
            </button>
        </div>

        <th:block th:replace="~{fragments/providers/accounts-table :: accountsTable}"/>
    </div>

    <th:block th:replace="~{fragments/providers/models-dialog :: modelsDialog}"/>
    <th:block th:replace="~{fragments/providers/add-account-dialog :: addAccountDialog}"/>

    <!--/* providers-usage.js first: the others call summarizeUsage/quotaColor. */-->
    <script src="/js/providers-usage.js"></script>
    <script src="/js/providers-models-dialog.js"></script>
    <script src="/js/providers-cards.js"></script>
    <script src="/js/providers-filter.js"></script>
    <script src="/js/providers-add-account.js"></script>
</th:block>
</html>
